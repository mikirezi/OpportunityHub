<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OpportunityHub</title>
        <link rel="stylesheet" href="/styles.css">
    </head>
    <body>
        <header>
        <h1>OpportunityHub</h1>
        <p>Find remote opportunities that match your skills.</p>
        </header>
        <main class="container">
            <section class="search_area">
        <input
         type="text"
         id="searchInput"
         placeholder="Search for jobs, skills or roles..."
         >
        <select id="employmentType">
            <option value="">All employment types</option>
            <option value="Full Time">Full Time</option>
            <option value="Part Time">Part Time></option>
            <option value="Contractor">Contractor</option>
            <option value="Intern">Intern</option>
        </select>
        <select id="seniority">
            <option value="">All experience levels</option>
            <option value="Entry-level">Entry-level</option>
            <option value="Mid-level">Mid-level</option>
            <option value="Senior">Senior</option>
            <option value="Manager">Manager</option>
        </select>
        <select id="sort">
            <option value="relevant">Most relevant</option>
            <option value="recent">Most recent</option>
            <option value="salaryDesc">Highest salary</option>
            <option value="nameAtoZ">Name A-Z</option>
        </select>
        <button id="searchButton">Search</button>
        </section>
        <section id="jobs"></section>
    </main>
        <footer>
            Job data provided by
            <a href="https://himalayas.app" target="_blank">Himalayas</a>
        </footer>
        <script>
            async function searchJobs() {
                const keyword =
                 document.getElementById("searchInput").value;
                 const employmentType =
                  document.getElementById("employmentType").value;
                  const seniority=
                   document.getElementById("seniority").value;
                   const sort =
                    document.getElementById("sort").value;
                const jobsContainer =
                 document.getElementById("jobs");
                jobsContainer.innerHTML =
                    "<p>Searching...</p>";
                const params = new URLSearchParams();
                if (keyword) {
                    params.append("q", keyword);
                }
                if (employmentType) {
                    params.append("employment_type", employmentType);
                }
                if (seniority) {
                    params.append("seniority", seniority);
                }
                try{
                    const response =
                     await fetch(`/api/jobs?${params.toString()}`);
                    const data = await response.json();
                    if (!response.ok || data.error) {
                        jobsContainer.innerHTML =
                         `<p class="error">${data.error || "unable to load jobs."}</p>`;
                        return;
                    }
                    if (!data.jobs || data.jobs.length === 0) {
                        jobsContainer.innerHTML =
                        "<p>No opportunities found. Try another search.</p>";
                        return;
                    }
                    jobsContainer.innerHTML = "";
                    data.jobs.forEach(job => {
                        const jobCard =
                         document.createElement("div");
                        jobCard.className = "job-card";
                        const salary =
                          job.minSalary && job.maxSalary
                          ? `${job.currency} ${job.minSalary} - ${job.maxSalary} / ${job.salaryPeriod}`
                          : "Salary not provided";
                        const seniorityText =
                           job.seniority
                           ? job.seniority.join(", ")
                           : "Not specified";
                    jobCard.innerHTML = `
                        <h2>${job.title}</h2>
                        <p class="company">
                            ${job.companyName}
                        </p>
                        <p class="details">
                        ${job.employmentType} 
                         .${seniorityText}
                        </p>
                        <p class="details">
                           ${salary}
                           </p>
                        <p>
                            ${job.excerpt}
                            </p>
                            <a
                            href="${job.applicationLink}"
                            target="_blank"
                        >
                        View Opportunity
                        </a>
                        `;
                        jobsContainer.appendChild(jobCard);
                    });
                } catch (error) {
                    jobsContainer.innerHTML =
                     "<p>Something went wrong. Please try again.</p>";
                }
            }
            document
            .getElementById("searchButton")
            .addEventListener("click", searchJobs);
            </script>
    </body>
</html>
